<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.5/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>
<body>
<div class="p-3">

    <div class="card">
        <div class="card-header">List Patients</div>
        <div class="card-body">
            <form method="get" th:action="@{/index}" class="d-flex mb-3">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Rechercher...">
                <button type="submit" class="btn btn-info">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <table class="table">

                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nom</th>
                    <th>Date</th>
                    <th>Malade</th>
                    <th>Score</th>



                </tr>
                <tr th:each="p:${patientList}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nom}"></td>
                    <td th:text="${p.dateNaissance}"></td>
                    <td th:text="${p.malade}"></td>
                    <td th:text="${p.score}"></td>

                    <td>
                        <a onclick="return confirm('Êtes-vous sûr de vouloir supprimer ?')"
                           th:href="@{delete(id=${p.id},keyword=${keyword},page=${currentPage})}"
                           class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i>
                        </a>

                        <a th:href="@{/edit(id=${p.id}, page=${currentPage}, keyword=${keyword})}" class="btn btn-warning btn-sm me-2">
                            <i class="bi bi-pencil-square"></i>
                        </a>

                    </td>





                </tr>
                </thead>
            </table>
            <ul class="nav nav-pills">
                <li th:each="page,status:${pages}">

                    <a th:href="@{/index(page=${status.index},keyword=${keyword})}"
                       th:class="${currentPage==status.index?'btn btn-info ms-1' : 'btn btn-outline-info ms-1'}"
                       th:text="${status.index}"></a>


                </li>
            </ul>
        </div>

    </div>
</div>


</body>
</html>
